[package]
name = "rusty_make"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Parse command logs into native jobs and dependency-safe batches"

[dependencies]
anyhow = "1"
brush-parser = "0.4"
clap = { version = "4", features = ["derive"] }
rayon = "1"
same-file = "1"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
